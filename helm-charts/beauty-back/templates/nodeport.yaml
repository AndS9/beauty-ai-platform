apiVersion: v1
kind: Service
metadata:
  name: {{ include "beauty-back.fullname" . }}-np
  namespace: {{ .Values.common.namespace }} 
spec:
  type: NodePort
  selector:
    {{- include "beauty-back.selectorLabels" . | nindent 4 }}
  ports:
  - protocol: TCP
    port: {{ .Values.service.port }}
    targetPort: http
    nodePort: 30003