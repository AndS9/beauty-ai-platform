apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "beauty-back.fullname" . }}-config
  namespace: {{ .Values.common.namespace }} 
  labels:
    {{- include "beauty-back.labels" . | nindent 4 }}
data:
    {{- range $key, $val := .Values.config }}
    {{ $key }}: {{ $val | quote }}
    {{- end }}