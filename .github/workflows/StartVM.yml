name: Start Azure Virtual Machine

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  
jobs:
  start:
    name: "Starting VM"
    runs-on: ubuntu-latest

    steps:
    - name: Azure login
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
