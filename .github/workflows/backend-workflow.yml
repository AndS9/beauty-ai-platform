name: Backend CI/CD

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

env:
  DockerImageName: beauty-backend
jobs:
  django-ci:
    name: build and test django app
    runs-on: ubuntu-latest
    environment: development
    strategy:
      matrix:
        python-version: ["3.13"]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    
    defaults:
      run:
        working-directory: ./backend
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      
    - name: Setup python-${{ matrix.python-version }} 
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov
        pip install -r requirements.txt
        
    - name: Testing frontend
      run: echo "Passing all types of tests"

    - name: Linting
      run: |
        flake8 . --show-source --statistics --exit-zero

    - name: Check Complexity
      run: |
        flake8 . --max-complexity=6 --exit-zero
        
    - name: Upload helm artifacts
      uses: actions/upload-artifact@v4
      with:
        name: helm-artifacts
        path: ${{ github.workspace }}/helm-charts

  docker-ci:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: django-ci
    environment: development
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build and push image
      uses: docker/build-push-action@v7
      with:
        context: ./backend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DockerImageName }}:1.0.${{ github.run_number }}
        
  helm-ci:
    name: Helm-chart CI
    needs: django-ci
    runs-on: ubuntu-latest
    environment: development
    steps:
    
    - name: Upload helm chart
      uses: actions/download-artifact@v4
      with:
        name: helm-artifacts
        path: .
    
    - name: Set Up Helm
      uses: azure/setup-helm@v5
    
    - name: Lint helm
      run: helm lint ./beauty-back

    - name: Template Helm
      run: helm template beautyfront ./beauty-back

  
  deploying-to-dev:
    name: Deploy helm dev
    uses: ./.github/workflows/helm-workflow.yml
    needs: [docker-ci, helm-ci]
    secrets: inherit
    with:
      environment: "development"
      version: "1.0.${{ github.run_number }}"

  # deploying-to-prod:
  #   name: Deploy helm to production
  #   uses: ./.github/workflows/helm-workflow.yml
  #   needs: [deploying-to-dev]
  #   secrets: inherit
  #   with:
  #     environment: "production"
  #     version: "1.0.${{ github.run_number }}"
  #     helm-values-path: "./beauty-back/values/values-prod.yaml"
    
