name: Node.js CI

on:
  push:
    branches: [ "frontend" ]
  pull_request:
    branches: [ "frontend" ]

env:
  DockerImageName: beauty-frontend
jobs:
  nodejs-ci:
    name: build and test Node.js app
    runs-on: ubuntu-latest
    environment: development
    strategy:
      matrix:
        node-version: [26.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - run: npm ci
    - run: npm run build --if-present
    - name: Testing frontend
      run: echo "Passing all types of tests"

    - name: Upload helm artifacts
      uses: actions/upload-artifact@v4
      with:
        name: helm-artifacts
        path: ${{ github.workspace }}/helm-charts

  docker-ci:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: nodejs-ci
    environment: development
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build and push image
      uses: docker/build-push-action@v7
      with:
        context: ./frontend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DockerImageName }}:1.0.${{ github.run_number }}
        
  helm-ci:
    name: Helm-chart CI
    needs: nodejs-ci
    runs-on: ubuntu-latest
    environment: development
    steps:
    
    - name: Upload helm chart
      uses: actions/download-artifact@v4
      with:
        name: helm-artifacts
        path: .
    
    - name: Set Up Helm
      uses: azure/setup-helm@v5
    
    - name: Lint helm
      run: helm lint ./beauty-front

    - name: Template Helm
      run: helm template beautyfront ./beauty-front

  
  deploying:
    environment: development
    name: Deploy to development env
    needs: [docker-ci, helm-ci]  # DON'T FORGET TO ADD DOCKER CI 
    runs-on: ubuntu-latest

    steps:
    - name: Upload helm chart
      uses: actions/download-artifact@v4
      with:
        name: helm-artifacts
        path: .
    
    - name: add_key
      run: | 
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        
        echo "${{ secrets.PRIVATE_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519

        ssh-keyscan -H "${{ vars.API_CLUSTER_HOST }}" >> ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts
             
    - name: copy package to VM
      run: scp -i ~/.ssh/id_ed25519 -r beauty-front developer@${{ vars.API_CLUSTER_HOST }}:/home/developer/

    - name: helm --dry-run
      run: |
       ssh -i ~/.ssh/id_ed25519 developer@${{ vars.API_CLUSTER_HOST }} "helm upgrade --install beauty-front beauty-front/ --dry-run \
          --set frontend.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DockerImageName }} \
          --set frontend.image.tag=1.0.${{ github.run_number }}"

    - name: Deploy Helm to cluster
      run: |
        ssh -i ~/.ssh/id_ed25519 developer@${{ vars.API_CLUSTER_HOST }} "helm upgrade --install beauty-front beauty-front/ \
          -n beauty-dev \
          --set frontend.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DockerImageName }} \
          --set frontend.image.tag=1.0.${{ github.run_number }}"
